<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <meta name="theme-color" content="#080603">

  <title>TemPad | Bienvenida</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="terminal">

    <section class="terminal__screen">

      <!-- CABECERA -->

      <header class="system-header">

        <div class="system-header__block">
          <span>TemPad OS v2.7.4</span>
        </div>

        <div class="system-header__block system-header__block--right">


          <strong class="online-status">
            Estado: online

            <span
              class="online-status__light"
              aria-hidden="true"
            ></span>
          </strong>

        </div>

      </header>

      <!-- ZONA CENTRAL -->

      <div class="welcome-stage">

        <div class="welcome-content">

          <div class="welcome-content__inner">

            <div class="main-logo">

              <div class="main-logo__seal">

                <img
                  src="../imagenes/TVALogo.png"
                  alt="Logotipo de la TVA"
                >

              </div>

              <h1>TemPad</h1>

             <span
                class="main-logo__line"
                aria-hidden="true"
              ></span>

            </div>

            <section class="welcome-message">

              <h2>Bienvenido, agente</h2>

              <p>
                Estás a punto de acceder a los archivos temporales
                autorizados por la TVA.
              </p>

            </section>

            <a
              class="start-button"
              href="./../index.html"
              aria-label="Iniciar TemPad"
            >

              <span
                class="start-button__shine"
                aria-hidden="true"
              ></span>

              <span
                class="start-button__arrow"
                aria-hidden="true"
              >
                ›
              </span>

              <span class="start-button__text">
                Inicio
              </span>

              <span
                class="start-button__arrow"
                aria-hidden="true"
              >
                ›
              </span>

            </a>

          </div>

        </div>

      </div>

      <!-- PIE -->

      <footer class="footer">

        <div class="footer__block">
          <span>Device</span>
          <strong>NS.628-24</strong>
        </div>

        <div class="footer__center">

          <p>For all time. Always.</p>

        </div>

        <div class="footer__block footer__block--right">
          <span>Security</span>
          <strong>Level 5</strong>
        </div>

      </footer>

    </section>

  </main>

</body>
</html>
