<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <meta name="theme-color" content="#080603">

    <title>TVA | Selección de destino</title>

    <link rel="stylesheet" href="./../CSS/styles.css">
</head>

<body>

    <main class="terminal">

        <div class="terminal__screen">

            <!-- CABECERA -->
            <header class="header">

                <div class="header__logo">
                    <img
                        src="./../imagenes/TVALogo.png"
                        alt="TVA"
                    >
                </div>

                <div class="header__content">

                    <p class="header__organization">
                        Time Variance Authority
                    </p>

                    <h1>Seleccione Destino</h1>

                </div>

            </header>

            <!-- DIVISOR -->
            <div class="section-divider">

                <span>Destinos autorizados</span>

                <span class="section-divider__code">
                    TVA / TEMP-04
                </span>

            </div>



            <!-- PIE -->
            <footer class="footer">

                <div class="footer__block">
                    <span>TVA Device</span>
                    <strong>NS.61280-24</strong>
                </div>

                <div class="footer__center">

                    <p>For all time. Always.</p>

                </div>

                <div class="footer__block footer__block--right">
                    <span>Security</span>
                    <strong>Level 5</strong>
                </div>

            </footer>

        </div>

    </main>

</body>

</html>
