<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <meta name="theme-color" content="#0d315f">

  <title>Plan en juego</title>

  <style>
    @import url(
      "https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap"
    );

    :root {
      --blue: #1268ad;
      --blue-dark: #082c54;
      --blue-light: #1f8de0;

      --red: #d52d2d;
      --red-dark: #871717;

      --yellow: #ffd33d;
      --yellow-dark: #d89b00;

      --cream: #fff3d7;
      --black: #090b0f;
      --white: #ffffff;

      --border: 4px solid var(--black);
    }

    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;

      background: var(--blue-dark);

      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      margin: 0;

      color: var(--black);

      font-family: "Barlow Condensed", Arial, sans-serif;

      background:
        linear-gradient(
          rgba(8, 44, 84, 0.96),
          rgba(8, 44, 84, 0.98)
        ),
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.08) 1px,
          transparent 1px
        );

      background-size:
        auto,
        8px 8px;

      overflow-x: hidden;
    }

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      background:
        repeating-conic-gradient(
          from 0deg at 50% 45%,
          rgba(255, 255, 255, 0.035) 0deg 2deg,
          transparent 2deg 7deg
        );

      opacity: 0.3;
    }

    button,
    a {
      font: inherit;
    }

    button {
      border: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }


    /* =====================================================
       CONTENEDOR PRINCIPAL
    ===================================================== */

    .game-screen {
      position: relative;

      display: flex;
      flex-direction: column;

      width: min(100%, 760px);

      /*
        Si el contenido cabe, ocupa exactamente la pantalla.
        Si no cabe, el contenedor crece y aparece scroll.
      */
      min-height: 100vh;
      min-height: 100dvh;

      margin: 0 auto;
      padding: 10px 14px 8px;

      z-index: 1;
    }


    /* =====================================================
       CARTA DEL PLAN
    ===================================================== */

    .scheme-card {
      position: relative;

      flex-shrink: 0;

      overflow: hidden;

      border: var(--border);
      border-radius: 18px;

      background: var(--cream);

      box-shadow:
        8px 8px 0 rgba(0, 0, 0, 0.85);
    }

    .scheme-card__type {
      padding: 5px 15px;

      color: var(--white);

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.1) 1px,
          transparent 1px
        ),
        var(--blue);

      background-size: 7px 7px;

      border-bottom: 3px solid var(--black);

      font-size: 0.9rem;
      font-weight: 800;

      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .scheme-card__title {
      margin: 0;
      padding: 7px 16px;

      color: var(--black);

      background:
        radial-gradient(
          circle,
          rgba(0, 0, 0, 0.13) 1px,
          transparent 1px
        ),
        var(--yellow);

      background-size: 8px 8px;

      border-bottom: 4px solid var(--black);

      font-family: "Anton", sans-serif;
      font-size: clamp(1.5rem, 6vw, 2.8rem);
      font-style: italic;
      font-weight: 400;
      line-height: 1;

      letter-spacing: 0.02em;
      text-transform: uppercase;

      text-shadow:
        1px 1px 0 rgba(255, 255, 255, 0.6);
    }

    .scheme-card__image {
      position: relative;

      width: 100%;
      aspect-ratio: 2.35 / 1;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #39195b,
          #e34331
        );
    }

    .scheme-card__image img {
      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;
    }

    .scheme-card__image::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.12) 1px,
          transparent 1px
        );

      background-size: 6px 6px;

      mix-blend-mode: overlay;
    }

    .scheme-card__description {
      margin: 0;
      padding: 10px 16px 12px;

      color: #171717;

      background:
        radial-gradient(
          circle,
          rgba(0, 0, 0, 0.07) 1px,
          transparent 1px
        ),
        var(--cream);

      background-size: 7px 7px;

      border-top: 4px solid var(--black);

      font-size: clamp(0.95rem, 3.2vw, 1.1rem);
      font-weight: 600;
      line-height: 1.15;
    }


    /* =====================================================
       CONTADOR DE AMENAZA
    ===================================================== */

    .threat-section {
      flex-shrink: 0;

      margin-top: 16px;

      text-align: center;
    }

    .threat-label {
      position: relative;

      display: inline-block;

      margin: 0 0 -5px;
      padding: 4px 18px;

      color: var(--black);

      background: var(--cream);

      border: 3px solid var(--black);

      font-size: 1rem;
      font-style: italic;
      font-weight: 800;

      letter-spacing: 0.04em;
      text-transform: uppercase;

      transform: rotate(-1deg);

      z-index: 2;
    }

    .threat-counter {
      position: relative;

      width: min(68%, 280px);

      margin: 0 auto;
      padding: 2px 20px;

      color: var(--white);

background:
  radial-gradient(
    circle,
    rgba(0, 0, 0, 0.12) 1px,
    transparent 1px
  ),
  var(--yellow);

      background-size: 8px 8px;

      border: var(--border);

      box-shadow:
        5px 5px 0 var(--black);
    }

    #contador {
      position: relative;

      margin: 0;

      color: var(--white);

      font-family: "Anton", sans-serif;
      font-size: clamp(3.5rem, 14vw, 5.3rem);
      font-style: italic;
      font-weight: 400;
      line-height: 1;

      text-shadow:
        4px 4px 0 var(--black),
        -2px -2px 0 var(--black);

      z-index: 2;
    }


    /* =====================================================
       BOTONES DE AMENAZA
    ===================================================== */

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;

      flex-shrink: 0;

      gap: 10px;

      margin-top: 14px;
    }

    .comic-button {
      position: relative;

      min-height: 62px;
      padding: 5px 8px;

      cursor: pointer;

      color: var(--white);

      border: var(--border);
      border-radius: 10px;

      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(0.9rem, 4vw, 1.25rem);
      font-style: italic;
      font-weight: 800;
      line-height: 1;

      letter-spacing: 0.025em;
      text-transform: uppercase;

      box-shadow:
        4px 4px 0 var(--black);

      transition:
        transform 0.15s ease,
        filter 0.15s ease,
        box-shadow 0.15s ease;

      overflow: hidden;
    }

    .comic-button::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.12) 1px,
          transparent 1px
        );

      background-size: 7px 7px;
    }

    .comic-button span {
      position: relative;
      display: block;

      z-index: 1;
    }

    .comic-button__value {
      margin-top: 2px;

      font-family: "Anton", sans-serif;
      font-size: 1.45rem;
      font-style: italic;
      font-weight: 400;
    }

    .comic-button--add {
      background: var(--blue);
    }

    .comic-button--remove {
      background: var(--red);
    }

    .comic-button:hover,
    .comic-button:focus-visible {
      filter: brightness(1.13);

      transform: translate(-2px, -2px);

      box-shadow:
        7px 7px 0 var(--black);

      outline: none;
    }

    .comic-button:active {
      transform: translate(3px, 3px);

      box-shadow:
        2px 2px 0 var(--black);
    }


    /* =====================================================
       SECCIÓN INFERIOR
    ===================================================== */

    .bottom-section {
      flex-shrink: 0;

      /*
        Empuja la sección al borde inferior cuando sobra espacio.
        Cuando el contenido no cabe, continúa debajo y se accede
        mediante scroll.
      */
      margin-top: auto;
      padding-top: 14px;
    }


    /* =====================================================
       BOTÓN VOLVER
    ===================================================== */

    .return-button {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 52px;

      padding: 8px 18px;

      color: var(--black);

      background:
        radial-gradient(
          circle,
          rgba(0, 0, 0, 0.12) 1px,
          transparent 1px
        ),
        var(--yellow);

      background-size: 8px 8px;

      border: var(--border);

      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(1.05rem, 4vw, 1.5rem);
      font-style: italic;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;

      box-shadow:
        5px 5px 0 var(--black);

      transform: rotate(-0.5deg);

      transition:
        transform 0.15s ease,
        filter 0.15s ease,
        box-shadow 0.15s ease;
    }

    .return-button:hover,
    .return-button:focus-visible {
      filter: brightness(1.08);

      transform:
        rotate(-0.5deg)
        translate(-2px, -2px);

      box-shadow:
        8px 8px 0 var(--black);

      outline: none;
    }

    .return-button:active {
      transform:
        rotate(-0.5deg)
        translate(3px, 3px);

      box-shadow:
        2px 2px 0 var(--black);
    }


    /* =====================================================
       ESTADO DE CONEXIÓN
    ===================================================== */

    .connection-status {
      margin: 10px 0 0;
      padding-bottom: 2px;

      color: rgba(255, 255, 255, 0.75);

      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <main class="game-screen">

    <section class="scheme-card">

      <div class="scheme-card__type">
        Plan secundario activo
      </div>

      <h2 class="scheme-card__title">
        Asalto al núcleo temporal
      </h2>

      <div class="scheme-card__image">

        <img
          src="./../imagenes/Hydra.jpg"
          alt="Una ciudad futurista amenazada"
        >

      </div>

      <p class="scheme-card__description">
        Una facción desconocida intenta sobrecargar el Núcleo Temporal
        para reescribir la línea temporal. Detén el asalto antes de que
        sea demasiado tarde.
      </p>

    </section>


    <section class="threat-section">

      <p class="threat-label">
        Amenaza actual
      </p>

      <div class="threat-counter">

        <h2 id="contador">
          0
        </h2>

      </div>

    </section>


    <section
      class="button-grid"
      aria-label="Controles de amenaza"
    >

      <button
        class="comic-button comic-button--add"
        type="button"
        onclick="sumar(1)"
      >
        <span>Añadir amenaza</span>
        <span class="comic-button__value">+1</span>
      </button>

      <button
        class="comic-button comic-button--remove"
        type="button"
        onclick="restar(1)"
      >
        <span>Quitar amenaza</span>
        <span class="comic-button__value">−1</span>
      </button>

    </section>


    <footer class="bottom-section">

      <a
        class="return-button"
        href="./p_viaje.html"
      >
        Volver a selección de destinos
      </a>

      <p
        id="connection-status"
        class="connection-status"
      >
        Conectando con el servidor...
      </p>

    </footer>

  </main>


  <!-- FIREBASE -->
  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyC6AxztIL3sQnttXBdJoDHzF6afDPOwlz8",
      authDomain: "mcmasivo.firebaseapp.com",
      databaseURL:
        "https://mcmasivo-default-rtdb.europe-west1.firebasedatabase.app/",
      projectId: "mcmasivo"
    };


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const contadorRef = ref(db, "contador");

    const contadorElement =
      document.querySelector("#contador");

    const connectionStatus =
      document.querySelector("#connection-status");


    onValue(
      contadorRef,

      function (snapshot) {
        contadorElement.textContent =
          snapshot.val() ?? 0;

        connectionStatus.textContent =
          "Sincronización activa";
      },

      function (error) {
        console.error(
          "Error al leer el contador:",
          error
        );

        connectionStatus.textContent =
          "Error de conexión";
      }
    );


    window.sumar = function (valor) {
      runTransaction(
        contadorRef,

        function (valorActual) {
          return (valorActual || 0) + valor;
        }
      ).catch(function (error) {
        console.error(
          "Error al sumar amenaza:",
          error
        );
      });
    };


    window.restar = function (valor) {
      runTransaction(
        contadorRef,

        function (valorActual) {
          return Math.max(
            0,
            (valorActual || 0) - valor
          );
        }
      ).catch(function (error) {
        console.error(
          "Error al restar amenaza:",
          error
        );
      });
    };
  </script>

</body>

</html>
