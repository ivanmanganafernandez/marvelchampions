<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TVA - Selección de destino</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="app">

        <header class="header">

            <div class="brand">

                <div class="logo">
                    TVA
                </div>

                <div>

                    <div class="mini">
                        TIME VARIANCE AUTHORITY
                    </div>

                    <h1>Selecciona un destino</h1>

                </div>

            </div>

        </header>

        <section class="card">

            <div class="img"></div>

            <div class="content">

                <span>1945</span>

                <h2>Hydra</h2>

                <p>
                    Descripción de la línea temporal.
                </p>

            </div>

            <button>

                <span>Viajar</span>

                <span class="arrow">➜</span>

            </button>

        </section>

        <section class="card">

            <div class="img"></div>

            <div class="content">

                <span>2012</span>

                <h2>Nueva York</h2>

                <p>
                    Descripción de la línea temporal.
                </p>

            </div>

            <button>

                <span>Viajar</span>

                <span class="arrow">➜</span>

            </button>

        </section>

        <section class="card">

            <div class="img"></div>

            <div class="content">

                <span>2025</span>

                <h2>Ultron</h2>

                <p>
                    Descripción de la línea temporal.
                </p>

            </div>

            <button>

                <span>Viajar</span>

                <span class="arrow">➜</span>

            </button>

        </section>

        <section class="card">

            <div class="img"></div>

            <div class="content">

                <span>2099</span>

                <h2>Apocalipsis</h2>

                <p>
                    Descripción de la línea temporal.
                </p>

            </div>

            <button>

                <span>Viajar</span>

                <span class="arrow">➜</span>

            </button>

        </section>

    </main>

</body>

</html>
