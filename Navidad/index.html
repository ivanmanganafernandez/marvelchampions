
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marvel Champions · Navidad</title>

  <style>
   
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background:
    radial-gradient(ellipse at 50% 0%, #31543b 0%, transparent 65%),
    linear-gradient(145deg, #10251c, #08140f);
  color: #fff5dc;
  font-family: Georgia, "Times New Roman", serif;
}

/* Cuadrícula que ocupa toda la pantalla */
.marcador {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
  width: 100%;
  height: 100vh;
  height: 100dvh;
  gap: clamp(6px, 1.3vh, 18px);
  padding: clamp(6px, 1.3vh, 18px);
  overflow: hidden;
}

/* Tarjetas */
.villano {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 2px solid #c6a568;
  border-radius: 13px;
  background:
    linear-gradient(145deg, #294934, #142a1e);
  box-shadow:
    inset 0 0 25px rgba(0,0,0,.25),
    0 5px 15px rgba(0,0,0,.25);
}

/* Línea decorativa dorada */
.villano::before {
  content: "";
  position: absolute;
  top: 5px;
  left: 5px;
  right: 5px;
  height: 2px;
  background: linear-gradient(
    90deg,
    transparent,
    #e9c982,
    transparent
  );
  z-index: 2;
}

/* Copo navideño */
.villano::after {
  content: "❄";
  position: absolute;
  top: 10px;
  right: 14px;
  color: #e9d6aa;
  font-size: clamp(13px, 2vw, 24px);
  opacity: .7;
  pointer-events: none;
}

/* Imagen del villano */
.imagen {
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 9px 9px 0;
}

.imagen img {
  width: 100%;
  height: 100%;
  min-height: 0;
  object-fit: contain;
  object-position: center;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,.4));
}

/* Información de vida */
.informacion {
  flex: 0 0 auto;
  min-width: 0;
  padding: clamp(6px, 1vh, 12px)
           clamp(9px, 1.5vw, 22px);
  text-align: center;
  background: rgba(5, 19, 12, .55);
  border-top: 1px solid rgba(218, 183, 109, .4);
}

.nombre {
  margin: 0 0 4px;
  font-family: Georgia, serif;
  font-size: clamp(11px, 1.8vw, 25px);
  font-weight: bold;
  color: #ebc77e;
  text-transform: uppercase;
  letter-spacing: .06em;
}

.vida {
  margin-bottom: 7px;
  color: #ffffff;
  font-family: Arial, sans-serif;
  font-size: clamp(19px, 3vw, 39px);
  font-weight: 800;
  line-height: 1.1;
}

.vida .maxima {
  color: #bbcabd;
  font-size: .48em;
  font-weight: normal;
}

/* Barras de vida */
.barra-fondo {
  width: 100%;
  height: clamp(9px, 1.5vh, 19px);
  overflow: hidden;
  background: #07140d;
  border: 1px solid #866d42;
  border-radius: 20px;
}

.barra {
  width: 100%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(
    180deg,
    #e06b60,
    #aa292e
  );
  box-shadow: 0 0 9px rgba(211, 62, 59, .45);
  transition: width .8s ease;
}

.porcentaje {
  margin-top: 5px;
  font-family: Arial, sans-serif;
  font-size: clamp(10px, 1.1vw, 15px);
  color: #e2d3ac;
}

/* Villano derrotado */
.derrotado .imagen {
  filter: grayscale(1);
  opacity: .45;
}

.derrotado .barra {
  width: 0%;
}

/* Estado de conexión */
#estado {
  position: fixed;
  bottom: 3px;
  right: 50%;
  transform: translateX(50%);
  z-index: 20;
  padding: 3px 9px;
  border-radius: 8px;
  background: rgba(4, 17, 10, .85);
  color: #b8cabd;
  font-family: Arial, sans-serif;
  font-size: 10px;
  pointer-events: none;
}

/* Pantallas pequeñas */
@media (max-width: 650px) {
  .marcador {
    gap: 7px;
    padding: 7px;
  }

  .villano {
    border-width: 1px;
    border-radius: 9px;
  }

  .imagen {
    padding: 5px;
  }

  .informacion {
    padding: 7px 5px 9px;
  }

  .nombre {
    font-size: clamp(10px, 2.8vw, 15px);
    letter-spacing: 0;
  }

  .vida {
    font-size: clamp(17px, 5vw, 26px);
  }

  .porcentaje {
    font-size: 10px;
  }

  .villano::after {
    top: 7px;
    right: 8px;
    font-size: 13px;
  }
}

/* Pantallas de poca altura */
@media (max-height: 550px) {
  .informacion {
    padding-top: 4px;
    padding-bottom: 5px;
  }

  .nombre {
    margin-bottom: 2px;
    font-size: clamp(10px, 2vh, 16px);
  }

  .vida {
    margin-bottom: 3px;
    font-size: clamp(15px, 4vh, 27px);
  }

  .porcentaje {
    margin-top: 2px;
    font-size: 10px;
  }
}

  </style>
</head>

<body>

  <main class="marcador">

    <section class="villano" id="octopus">
      <div class="imagen">
        <img src="imagenes/octopus.png" alt="Doctor Octopus">
      </div>
      <div class="informacion">
        <h2 class="nombre">Doctor Octopus</h2>
        <div class="vida">
          <span class="actual">--</span>
          <span class="maxima">/ -- PV</span>
        </div>
        <div class="barra-fondo">
          <div class="barra"></div>
        </div>
        <div class="porcentaje">--%</div>
      </div>
    </section>

    <section class="villano" id="electro">
      <div class="imagen">
        <img src="imagenes/electro.png" alt="Electro">
      </div>
      <div class="informacion">
        <h2 class="nombre">Electro</h2>
        <div class="vida">
          <span class="actual">--</span>
          <span class="maxima">/ -- PV</span>
        </div>
        <div class="barra-fondo">
          <div class="barra"></div>
        </div>
        <div class="porcentaje">--%</div>
      </div>
    </section>

    <section class="villano" id="buitre">
      <div class="imagen">
        <img src="imagenes/buitre.png" alt="Buitre">
      </div>
      <div class="informacion">
        <h2 class="nombre">Buitre</h2>
        <div class="vida">
          <span class="actual">--</span>
          <span class="maxima">/ -- PV</span>
        </div>
        <div class="barra-fondo">
          <div class="barra"></div>
        </div>
        <div class="porcentaje">--%</div>
      </div>
    </section>

    <section class="villano" id="sandman">
      <div class="imagen">
        <img src="imagenes/sandman.png" alt="Hombre de Arena">
      </div>
      <div class="informacion">
        <h2 class="nombre">Hombre de Arena</h2>
        <div class="vida">
          <span class="actual">--</span>
          <span class="maxima">/ -- PV</span>
        </div>
        <div class="barra-fondo">
          <div class="barra"></div>
        </div>
        <div class="porcentaje">--%</div>
      </div>
    </section>

  </main>

  <div id="estado">Conectando con Firebase...</div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

    import { getFirestore, doc, onSnapshot }
      from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

    import { getAuth, signInAnonymously, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDrZ0oOMYX0YH2cvgYD4pc9zU1jNenC1v8",
      authDomain: "marvel-champions-navidad.firebaseapp.com",
      projectId: "marvel-champions-navidad",
      storageBucket: "marvel-champions-navidad.firebasestorage.app",
      messagingSenderId: "442553244844",
      appId: "1:442553244844:web:c42e22c03a66d335d61309"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const ids = ["octopus", "electro", "buitre", "sandman"];
    const estado = document.getElementById("estado");

    function actualizarVillano(id, datos) {
      const elemento = document.getElementById(id);
      if (!elemento) return;

      const maxima = Number(datos.vidaMaxima);
      const actual = Number(datos.vidaActual);

      if (!Number.isFinite(maxima) ||
          !Number.isFinite(actual) ||
          maxima <= 0) {
        throw new Error("Datos de vida incorrectos: " + id);
      }

      const porcentaje = Math.max(
        0,
        Math.min(100, actual / maxima * 100)
      );

      elemento.querySelector(".actual").textContent =
        actual.toLocaleString("es-ES");

      elemento.querySelector(".maxima").textContent =
        "/ " + maxima.toLocaleString("es-ES") + " PV";

      elemento.querySelector(".barra").style.width =
        porcentaje + "%";

      elemento.querySelector(".porcentaje").textContent =
        Math.round(porcentaje) + "%";

      elemento.classList.toggle("derrotado", actual <= 0);
    }

    let escuchando = false;

    onAuthStateChanged(auth, async usuario => {
      if (!usuario) {
        try {
          await signInAnonymously(auth);
        } catch (error) {
          console.error(error);
          estado.textContent = "Error de autenticación";
        }
        return;
      }

      if (escuchando) return;
      escuchando = true;

      ids.forEach(id => {
        onSnapshot(
          doc(db, "villanos", id),
          snapshot => {
            if (!snapshot.exists()) {
              estado.textContent = "Falta el villano: " + id;
              return;
            }

            try {
              actualizarVillano(id, snapshot.data());
              estado.textContent = "Conectado · En directo";
            } catch (error) {
              console.error(error);
              estado.textContent = "Error en los datos";
            }
          },
          error => {
            console.error(error);
            estado.textContent = "Error de conexión con Firestore";
          }
        );
      });
    });
  </script>

</body>
</html>
