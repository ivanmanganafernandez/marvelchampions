
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marvel Champions · Especial Navidad</title>

<style>
:root {
  --crema: #f5dfaa;
  --dorado: #d7a653;
  --verde: #153c29;
  --verde-oscuro: #092518;
  --rojo: #c83d40;
  --negro: #211b16;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  color: var(--crema);
  font-family: Georgia, serif;
  background-color: #d9bc82;
  background-image:
    radial-gradient(#9e7b45 0.8px, transparent 0.8px);
  background-size: 9px 9px;
}

/* DISTRIBUCIÓN 2 X 2 */

.marcador {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
  gap: 7px;
  padding: 7px;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

/* VIÑETAS */

.villano {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 4px solid #231a12;
  border-radius: 9px;

  background:
    radial-gradient(
      ellipse at 50% 38%,
      #38664a 0%,
      #1d4730 52%,
      #0c291c 100%
    );

  box-shadow:
    inset 0 0 0 2px #d8aa57,
    inset 0 0 30px rgba(0,0,0,.3);
}

/* TEXTURA DE CÓMIC */

.villano::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;

  background-image:
    radial-gradient(
      rgba(0,0,0,.18) 1px,
      transparent 1px
    );

  background-size: 8px 8px;
  opacity: .5;
}

/* LUCES DE NAVIDAD */

.luces {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 43px;
  z-index: 7;
  pointer-events: none;
}

.luces svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.cable {
  fill: none;
  stroke: #161b13;
  stroke-width: 3;
}

.bombilla {
  stroke: #231a12;
  stroke-width: 1.5;
  filter: drop-shadow(0 0 4px currentColor);
}

/* ZONA DEL PERSONAJE */

.imagen {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px 8px 0;
}

.imagen::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      ellipse at center,
      rgba(237,201,112,.13),
      transparent 65%
    );
  pointer-events: none;
}

.imagen img {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  min-height: 0;
  object-fit: contain;
  object-position: center;
  filter:
    drop-shadow(0 8px 9px rgba(0,0,0,.55));
}

/* AJUSTES DE PERSONAJES */

#octopus .imagen img {
  transform: scale(1.16);
}

#electro .imagen img {
  transform: scale(1.20);
}

#buitre .imagen img {
  transform: scale(1.11);
}

#sandman .imagen img {
  transform: scale(1.07);
}

/* ZONA INFERIOR DE VIDA */

.informacion {
  position: relative;
  z-index: 4;
  flex: 0 0 auto;
  min-width: 0;
  padding: 20px 22px 12px;
  text-align: center;

  background:
    linear-gradient(
      180deg,
      rgba(12,51,31,.88),
      #092718
    );

  border-top: 2px solid #b98b46;
}

/* PERGAMINO DEL NOMBRE */

.nombre {
  position: absolute;
  left: 50%;
  top: -22px;
  transform: translateX(-50%) rotate(-1deg);
  z-index: 6;

  max-width: 90%;
  margin: 0;
  padding: 7px 25px;

  color: #21170f;
  background:
    linear-gradient(
      180deg,
      #fff0c3,
      #eac98a
    );

  border: 2px solid #3c2816;
  border-radius: 6px 6px 12px 12px;

  box-shadow:
    0 3px 0 #8d562e,
    0 5px 8px rgba(0,0,0,.35);

  font-family: Georgia, serif;
  font-weight: 900;
  font-style: italic;
  font-size: clamp(13px, 2vw, 28px);
  text-transform: uppercase;
  letter-spacing: .5px;
  line-height: 1.05;
  white-space: nowrap;
}

/* DETALLES DEL PERGAMINO */

.nombre::before,
.nombre::after {
  content: "✦";
  color: #a13432;
  font-style: normal;
  font-size: .7em;
  vertical-align: middle;
}

.nombre::before {
  margin-right: 12px;
}

.nombre::after {
  margin-left: 12px;
}

/* VIDA */

.vida {
  margin: 9px 0 8px;
  font-family: Georgia, serif;
  font-size: clamp(22px, 3vw, 41px);
  font-weight: 900;
  line-height: 1.05;
  color: #fff8e7;
  text-shadow:
    2px 2px 0 #18110c,
    -1px -1px 0 #18110c;
}

.vida .maxima {
  font-size: .66em;
  color: #f0dfb8;
  font-weight: 600;
}

/* BARRA DE VIDA */

.vida-contenedor {
  display: flex;
  align-items: center;
  gap: 12px;
}

.barra-fondo {
  flex: 1;
  min-width: 0;
  height: clamp(15px, 2.2vh, 25px);
  overflow: hidden;
  background: #341b1b;
  border: 3px solid #d7a653;
  border-radius: 20px;
  box-shadow:
    0 0 0 2px #21170f,
    inset 0 2px 4px rgba(0,0,0,.65);
}

.barra {
  width: 100%;
  height: 100%;
  border-radius: 12px;
  background:
    repeating-linear-gradient(
      -45deg,
      transparent 0 8px,
      rgba(255,255,255,.08) 8px 13px
    ),
    linear-gradient(
      180deg,
      #ee6861,
      #b62831
    );
  transition: width .8s ease;
}

.porcentaje {
  flex: 0 0 auto;
  min-width: 54px;
  padding: 4px 8px;

  color: #fff0c1;
  font-family: Georgia, serif;
  font-size: clamp(12px, 1.3vw, 19px);
  font-weight: 900;
  text-align: center;

  background: #113d2a;
  border: 2px solid var(--dorado);
  border-radius: 7px;
  box-shadow: 0 0 0 2px #21170f;
}

/* ADORNOS NAVIDEÑOS */

.decoracion {
  position: absolute;
  bottom: 9px;
  z-index: 5;
  pointer-events: none;
  font-size: clamp(15px, 1.7vw, 25px);
  filter: drop-shadow(2px 2px 1px #17120c);
}

.decoracion.izquierda {
  left: 12px;
}

.decoracion.derecha {
  right: 12px;
}

/* COPOS */

.copo {
  position: absolute;
  z-index: 3;
  color: rgba(255,245,213,.7);
  font-size: clamp(12px, 1.5vw, 24px);
  pointer-events: none;
}

.copo.uno {
  top: 17%;
  left: 5%;
}

.copo.dos {
  top: 20%;
  right: 6%;
}

/* DERROTADO */

.derrotado .imagen {
  filter: grayscale(1);
  opacity: .5;
}

.derrotado .barra {
  width: 0%;
}

.derrotado .nombre {
  background: #b5ae9d;
}

/* ESTADO DE FIREBASE */

#estado {
  position: fixed;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;

  padding: 5px 12px;
  background: #17261c;
  color: #fff0c7;
  border: 1px solid #d7a653;
  border-radius: 5px;
  font-family: Arial, sans-serif;
  font-size: 11px;
}

#estado.conectado {
  display: none;
}

/* PANTALLAS PEQUEÑAS */

@media (max-width: 650px) {
  .marcador {
    gap: 5px;
    padding: 5px;
  }

  .villano {
    border-width: 2px;
    border-radius: 5px;
  }

  .luces {
    height: 26px;
  }

  .imagen {
    padding: 16px 3px 0;
  }

  .informacion {
    padding: 15px 6px 7px;
  }

  .nombre {
    top: -13px;
    max-width: 96%;
    padding: 3px 7px;
    border-width: 1px;
    font-size: clamp(9px, 2.45vw, 14px);
    letter-spacing: 0;
  }

  .nombre::before,
  .nombre::after {
    display: none;
  }

  .vida {
    margin: 4px 0 6px;
    font-size: clamp(17px, 4.3vw, 26px);
  }

  .vida-contenedor {
    gap: 6px;
  }

  .barra-fondo {
    height: 13px;
    border-width: 2px;
  }

  .porcentaje {
    min-width: 38px;
    padding: 2px 4px;
    font-size: 10px;
    border-width: 1px;
  }

  .decoracion {
    font-size: 13px;
  }
}

/* PANTALLAS BAJAS */

@media (max-height: 600px) {
  .informacion {
    padding-top: 14px;
    padding-bottom: 5px;
  }

  .nombre {
    top: -12px;
    padding-top: 3px;
    padding-bottom: 3px;
    font-size: clamp(10px, 2vh, 17px);
  }

  .vida {
    margin: 2px 0 5px;
    font-size: clamp(15px, 3.5vh, 26px);
  }

  .barra-fondo {
    height: 13px;
  }

  .decoracion {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .barra {
    transition: none;
  }
}
</style>
</head>

<body>

<main class="marcador">

  <!-- DOCTOR OCTOPUS -->
  <section class="villano" id="octopus">

<div id="estado">Conectando con Firebase...</div>

<script>
/* GUIRNALDAS SVG DECORATIVAS */
const guirnalda = `
<svg viewBox="0 0 600 55" preserveAspectRatio="none"
     xmlns="http://www.w3.org/2000/svg">
  <path class="cable"
    d="M0 5 Q75 45 150 10 T300 10 T450 10 T600 5"/>
  <g class="bombillas">
    <ellipse cx="26" cy="16" rx="5" ry="8" fill="#ff6767" class="bombilla"/>
    <ellipse cx="72" cy="28" rx="5" ry="8" fill="#f6d45e" class="bombilla"/>
    <ellipse cx="119" cy="21" rx="5" ry="8" fill="#88db80" class="bombilla"/>
    <ellipse cx="167" cy="16" rx="5" ry="8" fill="#87c5ee" class="bombilla"/>
    <ellipse cx="214" cy="28" rx="5" ry="8" fill="#ff6767" class="bombilla"/>
    <ellipse cx="261" cy="21" rx="5" ry="8" fill="#f6d45e" class="bombilla"/>
    <ellipse cx="309" cy="15" rx="5" ry="8" fill="#88db80" class="bombilla"/>
    <ellipse cx="356" cy="27" rx="5" ry="8" fill="#87c5ee" class="bombilla"/>
    <ellipse cx="403" cy="20" rx="5" ry="8" fill="#ff6767" class="bombilla"/>
    <ellipse cx="451" cy="15" rx="5" ry="8" fill="#f6d45e" class="bombilla"/>
    <ellipse cx="498" cy="27" rx="5" ry="8" fill="#88db80" class="bombilla"/>
    <ellipse cx="545" cy="20" rx="5" ry="8" fill="#87c5ee" class="bombilla"/>
  </g>
</svg>`;

document.querySelectorAll(".luces").forEach(elemento => {
  elemento.innerHTML = guirnalda;
});
</script>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import { getFirestore, doc, onSnapshot }
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

import { getAuth, signInAnonymously, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDrZ0oOMYX0YH2cvgYD4pc9zU1jNenC1v8",
  authDomain: "marvel-champions-navidad.firebaseapp.com",
  projectId: "marvel-champions-navidad",
  storageBucket: "marvel-champions-navidad.firebasestorage.app",
  messagingSenderId: "442553244844",
  appId: "1:442553244844:web:c42e22c03a66d335d61309"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const ids = [
  "octopus",
  "electro",
  "buitre",
  "sandman"
];

const estado = document.getElementById("estado");
const cargados = new Set();

function actualizarVillano(id, datos) {
  const elemento = document.getElementById(id);
  if (!elemento) return;

  const maxima = Number(datos.vidaMaxima);
  const actual = Number(datos.vidaActual);

  if (
    !Number.isFinite(maxima) ||
    !Number.isFinite(actual) ||
    maxima <= 0
  ) {
    throw new Error("Datos incorrectos: " + id);
  }

  const porcentaje = Math.max(
    0,
    Math.min(100, actual / maxima * 100)
  );

  elemento.querySelector(".actual").textContent =
    actual.toLocaleString("es-ES");

  elemento.querySelector(".maxima").textContent =
    "/ " + maxima.toLocaleString("es-ES") + " PV";

  elemento.querySelector(".barra").style.width =
    porcentaje + "%";

  elemento.querySelector(".porcentaje").textContent =
    Math.round(porcentaje) + "%";

  elemento.classList.toggle("derrotado", actual <= 0);
}

let escuchando = false;

function mostrarError(mensaje) {
  estado.classList.remove("conectado");
  estado.textContent = mensaje;
}

onAuthStateChanged(auth, async usuario => {
  if (!usuario) {
    try {
      await signInAnonymously(auth);
    } catch (error) {
      console.error(error);
      mostrarError("Error de autenticación");
    }
    return;
  }

  if (escuchando) return;
  escuchando = true;

  ids.forEach(id => {
    onSnapshot(
      doc(db, "villanos", id),
      snapshot => {
        if (!snapshot.exists()) {
          mostrarError("Falta el villano: " + id);
          return;
        }

        try {
          actualizarVillano(id, snapshot.data());
          cargados.add(id);

          if (cargados.size === ids.length) {
            estado.textContent = "Conectado · En directo";
            estado.classList.add("conectado");
          }
        } catch (error) {
          console.error(error);
          mostrarError("Error en los datos");
        }
      },
      error => {
        console.error(error);
        mostrarError("Error de conexión con Firestore");
      }
    );
  });
});
</script>

</body>
